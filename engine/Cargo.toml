[package]
name = "lunar-engine"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "masks"
path = "src/bin/masks.rs"

[dependencies]
js-sys = "0.3.107"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
