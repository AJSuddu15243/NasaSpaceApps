services:
  db:
    image: postgres:16-alpine
    container_name: lunar-window-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lunar
      POSTGRES_PASSWORD: lunar
      POSTGRES_DB: lunar_window
    ports:
      - "5432:5432"
    volumes:
      - lunar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunar -d lunar_window"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lunar-db-data:
