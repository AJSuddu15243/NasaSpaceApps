# MOON_ME; latitude degrees north, longitude degrees east in [-180, 180].
moon_radius_m: 1737400
ephemeris:
  start: "2026-01-01T00:00Z"
  end: "2030-12-31T23:00Z"
  step_hours: 1
terrain:
  far_field_m: 240
  near_field_m: 80
  heatmap_cell_m: 160
  max_distance_km: 150
masks:
  site_bins: 360
  grid_bins: 64
data_budget_mb: 25
# Relative to repository root, independent of working directory.
paths:
  raw: pipeline/data/raw
  cache: pipeline/data/cache
  out: web/public/data
