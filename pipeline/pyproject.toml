[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lunar-pipeline"
version = "0.1.0"
description = "Offline lunar terrain and ephemeris pipeline"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "requests",
    "pyyaml",
    "rasterio",
    "jsonschema",
    "rfc3339-validator==0.1.4",
    "rfc3986-validator==0.1.1",
]

[dependency-groups]
dev = ["pytest", "ruff", "pyproj"]

[tool.hatch.build.targets.wheel]
packages = ["src/lunar_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
